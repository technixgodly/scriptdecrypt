<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raven Script Decryptor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --success-hover: #16a34a;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input[type="text"], textarea {
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    input[type="file"] {
      background: #0b1120;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 0.75rem;
    }

    textarea {
      resize: vertical;
      min-height: 280px;
      font-family: Consolas, "Courier New", monospace;
      white-space: pre;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success);
      color: #0f172a;
      display: none;
    }

    .btn-success:hover {
      background: var(--success-hover);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Raven Script Decryptor</h1>

    <div class="config-grid">
      <div class="field">
        <label for="fileInput">Upload Java File (.java)</label>
        <input type="file" id="fileInput" accept=".java,text/plain" />
      </div>

      <div class="field">
        <label for="aesKey">AES-128 Key</label>
        <input type="text" id="aesKey" value="K8ai@rUb^mj7X91P" />
      </div>

      <div class="field">
        <label for="clientUid">Target UID</label>
        <input type="text" id="clientUid" value="1" />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="runBtn" onclick="handleDecrypt()">Decrypt</button>
      <button class="btn-success" id="downloadBtn" onclick="handleDownload()">Download Decrypted File</button>
    </div>

    <div id="statusError" class="error-msg"></div>

    <div class="field">
      <label for="outputScript">Decrypted Output</label>
      <textarea id="outputScript" readonly placeholder="Decrypted code will appear here..."></textarea>
    </div>
  </div>

  <script>
    let activeFileName = "script.java";
    let decryptedPayload = "";

    const fileInput = document.getElementById("fileInput");
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) {
        activeFileName = file.name;
        document.getElementById("statusError").style.display = "none";
      }
    });

    function parseHexChar(c) {
      const code = c.charCodeAt(0);
      if (code >= 48 && code <= 57) return code - 48;
      if (code >= 65 && code <= 70) return code - 55;
      if (code >= 97 && code <= 102) return code - 87;
      return 0;
    }

    function extractBase64(rawInput) {
      const parts = rawInput.split('"');
      if (parts.length >= 2) {
        return parts[1].trim();
      }
      return rawInput.trim();
    }

    function decryptAES128ECB(base64Payload, keyStr) {
      const key = CryptoJS.enc.Utf8.parse(keyStr);
      const decrypted = CryptoJS.AES.decrypt(base64Payload, key, {
        mode: CryptoJS.mode.ECB,
        padding: CryptoJS.pad.Pkcs7
      });
      return CryptoJS.enc.Utf8.stringify(decrypted);
    }

    function decryptXorChain(hexString) {
      if (hexString.length < 2) {
        throw new Error("Payload length insufficient after AES pass.");
      }

      const prev = (parseHexChar(hexString.charAt(0)) << 4) | parseHexChar(hexString.charAt(1));
      const body = hexString.substring(2);

      const bLen = Math.floor(body.length / 2);
      const b = new Uint8Array(bLen);
      for (let i = 0; i < bLen; i++) {
        b[i] = ((parseHexChar(body.charAt(2 * i)) << 4) | parseHexChar(body.charAt(2 * i + 1))) & 0xFF;
      }

      const f = [-36, -73, 44, -25, -37, -37, -28, 35, -44, -11, -122, -9, -50, 16, 11, 19];
      const k = new Uint8Array(16);
      for (let n = 0; n < 16; n++) {
        k[n] = (((f[n] & 0xFF) - 29) & 0xFF) ^ 0x6D;
      }

      const cc = 73;
      const out = new Uint8Array(bLen);
      let p = prev & 0xFF;

      for (let n = 0; n < bLen; n++) {
        let v = (b[n] ^ k[n % 16]) & 0xFF;
        v = (v - cc) & 0xFF;
        out[n] = (v ^ p) & 0xFF;
        p = b[n];
      }

      return new TextDecoder("utf-8").decode(out);
    }

    async function handleDecrypt() {
      const errorDiv = document.getElementById("statusError");
      const outputArea = document.getElementById("outputScript");
      const downloadBtn = document.getElementById("downloadBtn");

      errorDiv.style.display = "none";
      errorDiv.innerText = "";
      downloadBtn.style.display = "none";
      decryptedPayload = "";

      try {
        const file = fileInput.files[0];
        if (!file) {
          throw new Error("Please select a .java file first.");
        }

        const rawContent = await file.text();
        const base64Payload = extractBase64(rawContent);

        if (!base64Payload) {
          throw new Error("No payload or double-quoted Base64 segment found in the file.");
        }

        const aesKey = document.getElementById("aesKey").value;
        const uid = document.getElementById("clientUid").value.trim();

        const layer1Decrypted = decryptAES128ECB(base64Payload, aesKey);
        if (!layer1Decrypted) {
          throw new Error("AES layer decryption produced empty plaintext. Check key or source format.");
        }

        let decoded = decryptXorChain(layer1Decrypted);
        decoded = decoded.replaceAll("size * 0.05506", "size * 0.05" + uid);

        decryptedPayload = decoded;
        outputArea.value = decoded;
        downloadBtn.style.display = "inline-block";
      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = "block";
        outputArea.value = "";
      }
    }

    function handleDownload() {
      if (!decryptedPayload) return;

      let outName = "";
      if (activeFileName.endsWith(".java")) {
        outName = activeFileName.replace(/\.java$/, "-decrypted.java");
      } else {
        const lastDot = activeFileName.lastIndexOf(".");
        if (lastDot !== -1) {
          outName = activeFileName.slice(0, lastDot) + "-decrypted" + activeFileName.slice(lastDot);
        } else {
          outName = activeFileName + "-decrypted";
        }
      }

      const blob = new Blob([decryptedPayload], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = outName;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
